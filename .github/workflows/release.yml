# 自动化发布：push 一个 v* 的 tag（如 v1.0.0）→ 云端打包 exe → 自动生成 Release
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包 exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DesktopPet
          --add-data "happy_*.png;."
          --add-data "walk*.png;."
          --add-data "pet.png;."
          --add-data "assets;assets"
          main.py

      - name: 计算 SHA256 校验值
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\DesktopPet.exe -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopPet.exe
          body: |
            ## v0.4.0 更新公告：手绘靶场

            - 小屋墙面新增手绘靶子入口，桌宠右键菜单也可直接进入“打靶游戏”。
            - 场内始终保持三个小球，支持 30 秒、1 分钟、2 分钟和不限时模式。
            - 实时统计命中、未命中、命中率和 Hit per minute（HPM）。
            - 每轮自动结算，按 HPM 保存最高十次成绩，同时记录模式与完成时间。
            - 排行榜会持久保存，游戏窗口内可随时查看。

            Windows 单文件 exe，双击即可运行。

            ### 校验值（SHA-256）
            ```
            ${{ steps.checksum.outputs.hash }}
            ```

            下载后执行 `certutil -hashfile DesktopPet.exe SHA256` 核对一致性。
          generate_release_notes: true
